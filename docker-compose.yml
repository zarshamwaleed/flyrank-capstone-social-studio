services:
  app:
    build: .
    container_name: social_media_studio_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/social_media_studio.db
      - DISCORD_WEBHOOK_URL=
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
